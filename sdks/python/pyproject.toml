[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chronon-sim"
version = "0.1.0"
description = "Python authoring SDK for Chronon Sim: describe a system in Python, compile it to the JSON model format."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
